workflows:
  ios-workflow:
    name: iOS Build and Publish
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.admar.app
    integrations:
      app_store_connect: "codemgck"
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --verbose
          cd ../..

      - name: Set up code signing
        script: |
          TEAM_ID="Q39G2BK6VX"
          PROFILE_UUID="c882a7e8-f888-41d0-8ded-0420e3b2505d"
          BUNDLE_ID="com.admar.app"

          echo "✅ Team ID: $TEAM_ID"
          echo "✅ Profile UUID: $PROFILE_UUID"

          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          echo "✅ Profile path: $PROFILE_PATH"

          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          cd ios/App
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = ${TEAM_ID};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = .*;/CODE_SIGN_STYLE = Manual;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_UUID};/g" App.xcodeproj/project.pbxproj
          cd ../..

          echo "✅ project.pbxproj updated:"
          grep -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER" ios/App/App.xcodeproj/project.pbxproj

          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>method</key>\n<string>app-store</string>\n<key>teamID</key>\n<string>%s</string>\n<key>signingStyle</key>\n<string>manual</string>\n<key>provisioningProfiles</key>\n<dict>\n<key>%s</key>\n<string>%s</string>\n</dict>\n</dict>\n</plist>\n' "$TEAM_ID" "$BUNDLE_ID" "$PROFILE_UUID" > /Users/builder/export_options.plist

          echo "✅ export_options.plist:"
          cat /Users/builder/export_options.plist
          plutil -lint /Users/builder/export_options.plist

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --archive-directory ../build \
            --export-options-plist /Users/builder/export_options.plist
          echo "📂 البحث عن IPA:"
          find /Users/builder/clone -name "*.ipa" 2>/dev/null

      - name: Move IPA to artifacts
        script: |
          mkdir -p build/ios/ipa
          IPA_PATH=$(find /Users/builder/clone -name "*.ipa" | head -1)
          echo "Found IPA at: $IPA_PATH"
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA found!"
            exit 1
          fi
          cp "$IPA_PATH" build/ios/ipa/
          echo "✅ IPA copied"
          ls -la build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true