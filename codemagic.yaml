workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 20
      xcode: latest

    scripts:
      # تنظيف كامل
      - rm -rf node_modules package-lock.json

      # تثبيت نظيف 100%
      - npm cache clean --force
      - npm install --legacy-peer-deps --include=dev

      # تأكيد أن Capacitor موجود
      - npx cap --version

      # إنشاء iOS من الصفر إذا غير موجود
      - npx cap add ios || true

      # sync الرسمي (هذا أهم سطر)
      - npx cap sync ios

      # CocoaPods
      - cd ios/App
      - pod install
      - cd ../..

    artifacts:
      - build/ios/ipa/*.ipa