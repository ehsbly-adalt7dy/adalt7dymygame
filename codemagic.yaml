workflows:
  ios-workflow:
    name: iOS Build and Publish
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.admar.app
    integrations:
      app_store_connect: "codemgck"
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --verbose
          cd ../..

      - name: Set up code signing
        script: |
          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          echo "Profile path: $PROFILE_PATH"

          PROFILE_UUID=$(strings "$PROFILE_PATH" | grep -E "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" | head -1)
          TEAM_ID=$(strings "$PROFILE_PATH" | grep -A1 "TeamIdentifier" | grep -v "TeamIdentifier" | tr -d '<string>' | tr -d '</string>' | tr -d ' ' | head -1)

          echo "✅ Profile UUID: $PROFILE_UUID"
          echo "✅ Team ID: $TEAM_ID"

          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          cd ios/App
          sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = $TEAM_ID;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = $PROFILE_UUID;/g" App.xcodeproj/project.pbxproj
          cd ../..

          cat > /Users/builder/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.admar.app</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "✅ export_options.plist:"
          cat /Users/builder/export_options.plist
          echo "✅ project.pbxproj signing settings:"
          grep -E "DEVELOPMENT_TEAM|CODE_SIGN_STYLE|PROVISIONING_PROFILE" ios/App/App.xcodeproj/project.pbxproj

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --archive-directory ../build \
            --export-options-plist /Users/builder/export_options.plist
          echo "📂 البحث عن IPA:"
          find /Users/builder/clone -name "*.ipa" 2>/dev/null

      - name: Move IPA to artifacts
        script: |
          mkdir -p build/ios/ipa
          IPA_PATH=$(find /Users/builder/clone -name "*.ipa" | head -1)
          echo "Found IPA at: $IPA_PATH"
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA found!"
            exit 1
          fi
          cp "$IPA_PATH" build/ios/ipa/
          echo "✅ IPA copied"
          ls -la build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true