workflows:
  ios-workflow:
    name: iOS Build and Publish
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.admar.app
    integrations:
      app_store_connect: "codemgck"
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --verbose
          cd ../..

      - name: Fix Bundle ID
        script: |
          cd ios/App
          sed -i '' 's/adalt7dy\.mar\.com/com.admar.app/g' App.xcodeproj/project.pbxproj
          echo "✅ Bundle ID after fix:"
          grep "PRODUCT_BUNDLE_IDENTIFIER" App.xcodeproj/project.pbxproj
          cd ../..

      - name: Set up code signing
        script: |
          TEAM_ID="Q39G2BK6VX"
          PROFILE_UUID="c882a7e8-f888-41d0-8ded-0420e3b2505d"
          BUNDLE_ID="com.admar.app"

          PROFILE_PATH=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" 2>/dev/null | head -1)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>method</key>\n<string>app-store</string>\n<key>teamID</key>\n<string>%s</string>\n<key>signingStyle</key>\n<string>manual</string>\n<key>provisioningProfiles</key>\n<dict>\n<key>%s</key>\n<string>%s</string>\n</dict>\n</dict>\n</plist>\n' "$TEAM_ID" "$BUNDLE_ID" "$PROFILE_UUID" > /Users/builder/export_options.plist

          plutil -lint /Users/builder/export_options.plist && echo "✅ plist valid"

      - name: Build IPA
        script: |
          TEAM_ID="Q39G2BK6VX"
          PROFILE_UUID="c882a7e8-f888-41d0-8ded-0420e3b2505d"

          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -archivePath ../build/App.xcarchive \
            -configuration Release \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive
          cd ../..

          xcodebuild \
            -exportArchive \
            -archivePath ios/build/App.xcarchive \
            -exportPath ios/build/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist

          echo "📂 البحث عن IPA:"
          find /Users/builder/clone -name "*.ipa" 2>/dev/null

      - name: Move IPA to artifacts
        script: |
          mkdir -p build/ios/ipa
          IPA_PATH=$(find /Users/builder/clone -name "*.ipa" | head -1)
          echo "Found IPA at: $IPA_PATH"
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA found!"
            exit 1
          fi
          cp "$IPA_PATH" build/ios/ipa/
          echo "✅ IPA copied"
          ls -la build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true