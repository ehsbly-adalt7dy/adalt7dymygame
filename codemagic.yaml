workflows:
  ios-workflow:
    name: iOS Build and Publish
    environment:
      node: 20
      xcode: latest
    integrations:
      app_store_connect: "codemgck"
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps

      - name: Capacitor sync
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --verbose
          cd ../..

      - name: Set up keychain
        script: keychain initialize

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Configure code signing
        script: |
          cd ios/App
          xcode-project use-profiles --project App.xcodeproj
          cd ../..

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App
          cd ../..

      - name: Move IPA to artifacts
        script: |
          mkdir -p build/ios/ipa
          find . -name "*.ipa" -exec cp {} build/ios/ipa/ \;

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true