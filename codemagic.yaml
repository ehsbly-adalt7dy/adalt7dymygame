workflows:
  ios-workflow:
    name: iOS Build and Publish

    environment:
      node: 20
      xcode: latest

    # ربط حساب Apple Developer (عدّل الاسم حسب ما أضفته)
    integrations:
      app_store_connect: "codemgck"  

    scripts:
      # ===== الخطوة 1: تثبيت الاعتمادات (هذا هو الحل) =====
      - name: Install dependencies
        script: |
          npm ci || npm install
          npm list @capacitor/cli  # للتحقق من التثبيت
      
      # ===== الخطوة 2: تحضير Capacitor (استخدم npx بدلاً من المسار المباشر) =====
      - name: Capacitor sync
        script: |
          npx cap add ios || true
          npx cap sync ios
      
      # ===== الخطوة 3: التوقيع الرقمي والبناء =====
      - name: Set up keychain for code signing
        script: keychain initialize

      - name: Fetch signing files
        script: |
          if [ -f "ios/App.xcodeproj/project.pbxproj" ]; then
            BUNDLE_ID=$(xcode-project detect-bundle-id)
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE \
              --create
          else
            echo "⚠️ مشروع iOS غير موجود، تأكد من نجاح npx cap sync"
            exit 1
          fi

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Configure code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          if [ -f "ios/App.xcodeproj/project.pbxproj" ]; then
            xcode-project build-ipa \
              --project ios/App.xcodeproj \
              --scheme App
          else
            echo "⚠️ مشروع iOS غير موجود"
            exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true