workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 20
      xcode: latest

    scripts:
      - npm install --legacy-peer-deps

      # إصلاح صلاحيات (احتياطي)
      - chmod -R +x node_modules || true

      # تشغيل Capacitor مباشرة من المصدر (بدون npx)
      - node node_modules/@capacitor/cli/dist/bin/capacitor.js add ios || true
      - node node_modules/@capacitor/cli/dist/bin/capacitor.js sync ios

      # تأكد
      - ls ios || true

    artifacts:
      - build/ios/ipa/*.ipa