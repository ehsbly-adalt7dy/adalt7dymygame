workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 20
      xcode: latest

    scripts:
      - npm install --legacy-peer-deps

      # تثبيت Capacitor بشكل مضمون
      - npm rebuild

      # تشغيل Capacitor مباشرة بدون npx (هذا هو الحل الحقيقي)
      - node node_modules/@capacitor/cli/bin/capacitor.js add ios || true
      - node node_modules/@capacitor/cli/bin/capacitor.js sync ios

      # تأكد أن iOS تم إنشاؤه
      - ls ios/App

      - cd ios/App
      - pod install
      - cd ../..

    artifacts:
      - build/ios/ipa/*.ipa