workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 20
      xcode: latest

    scripts:
      - npm install --legacy-peer-deps

      # تأكد أن Capacitor موجود
      - node -e "console.log(require('@capacitor/cli/package.json').version)"

      # تشغيل sync بالطريقة الآمنة (بدون npx وبدون .bin)
      - node node_modules/@capacitor/cli/bin/capacitor.cjs sync ios || node node_modules/@capacitor/cli/bin/capacitor.js sync ios

      - cd ios/App
      - pod install
      - cd ../..

    artifacts:
      - build/ios/ipa/*.ipa