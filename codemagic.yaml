workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 22
      xcode: latest

    scripts:
      - npm install
      - npx cap sync ios

      - cd ios/App
      - pod install
      - cd ../..

      - xcode-project build-ipa \
          --workspace ios/App/App.xcworkspace \
          --scheme App

    artifacts:
      - build/ios/ipa/*.ipa