workflows:
  ios-workflow:
    name: iOS Build and Publish
    environment:
      node: 20
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.admar.app
    integrations:
      app_store_connect: "codemgck"
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps

      - name: Capacitor sync
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --verbose
          cd ../..

      - name: Create export options plist
        script: |
          cat > /Users/builder/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>bundleID</key>
            <string>com.admar.app</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          echo "✅ export_options.plist created"
          cat /Users/builder/export_options.plist

      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --archive-directory ../build \
            --export-options-plist /Users/builder/export_options.plist
          echo "📂 البحث عن IPA:"
          find /Users/builder/clone -name "*.ipa" 2>/dev/null

      - name: Move IPA to artifacts
        script: |
          mkdir -p build/ios/ipa
          IPA_PATH=$(find /Users/builder/clone -name "*.ipa" | head -1)
          echo "Found IPA at: $IPA_PATH"
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA found!"
            exit 1
          fi
          cp "$IPA_PATH" build/ios/ipa/
          echo "✅ IPA copied to build/ios/ipa/"
          ls -la build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true