workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 20
      xcode: latest

    scripts:
      - npm ci --unsafe-perm=true
      - npm rebuild

      - node node_modules/@capacitor/cli/bin/capacitor.js sync ios

      - cd ios/App
      - pod install
      - cd ../..

    artifacts:
      - build/ios/ipa/*.ipa