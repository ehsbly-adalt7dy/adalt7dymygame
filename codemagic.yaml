workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 20
      xcode: latest

    scripts:
      - npm install --legacy-peer-deps

      # إنشاء iOS من Capacitor
      - npx cap add ios || true
      - npx cap sync ios

      # فقط للتأكد
      - ls

    artifacts:
      - build/ios/ipa/*.ipa