workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 22
      xcode: latest

    scripts:
      - npm install

      - chmod -R 777 node_modules || true

       -  node node_modules/@capacitor/cli/bin/capacitor.js sync ios

      - cd ios/App
      - pod install
      - cd ../..

      - xcode-project build-ipa \
          --workspace ios/App/App.xcworkspace \
          --scheme App

    artifacts:
      - build/ios/ipa/*.ipa