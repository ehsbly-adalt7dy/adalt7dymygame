workflows:
  ios-workflow:
    name: iOS Build

    environment:
      node: 20
      xcode: latest

    scripts:
      - rm -rf node_modules package-lock.json
      - npm cache clean --force
      - npm install --production=false --legacy-peer-deps

      # تحقق أن Capacitor موجود فعلاً
      - ls node_modules/@capacitor/cli

      # الطريقة الرسمية فقط
      - npx cap sync ios

      - cd ios/App
      - pod install
      - cd ../..

    artifacts:
      - build/ios/ipa/*.ipa