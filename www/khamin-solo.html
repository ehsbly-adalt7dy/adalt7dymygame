*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--purple:#aa96da;--purple-d:#8f78d6;--blue:#a8d8ea;--blue-d:#7ec8e3;--pink:#ff8c94;--peach:#ffd3b6;--green:#4caf50;--red:#ff4444;--gold:#ffd700;--ink:#3b3360;--mute:#7b7399}
html,body{height:100%;overflow:hidden}
body{font-family:'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;background:linear-gradient(160deg,#a8d8ea 0%,#aa96da 100%);color:var(--ink);display:flex;justify-content:center;user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
input{user-select:text;-webkit-user-select:text}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;border-radius:50%;filter:blur(40px);animation:drift 14s ease-in-out infinite alternate}
.bg .b1{width:300px;height:300px;background:#fff;top:-80px;right:-60px;opacity:.38}
.bg .b2{width:340px;height:340px;background:#ff8c94;bottom:-120px;left:-100px;opacity:.28;animation-delay:-5s}
.bg .b3{width:240px;height:240px;background:#ffd3b6;top:45%;left:-80px;opacity:.3;animation-delay:-9s}
.bg b{position:absolute;bottom:-70px;left:var(--x);font-size:var(--s);font-weight:900;color:rgba(255,255,255,.3);animation:floatUp 15s linear infinite;animation-delay:var(--d)}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.15)}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-115vh) rotate(25deg);opacity:0}}
#app{position:relative;z-index:1;width:100%;max-width:480px;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
#flash{position:fixed;inset:0;pointer-events:none;z-index:140;opacity:0}
#flash.on{animation:flashOut .6s ease-out}
#flash.bad{background:radial-gradient(circle at center,transparent 40%,rgba(255,68,68,.5))}
#flash.good{background:radial-gradient(circle at center,transparent 40%,rgba(76,175,80,.42))}
@keyframes flashOut{0%{opacity:1}100%{opacity:0}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 14px max(16px,env(safe-area-inset-bottom));overflow-y:auto;scrollbar-width:none;animation:fade .35s ease}
.screen::-webkit-scrollbar{display:none}
.screen.center>:first-child{margin-top:auto}
.screen.center>:last-child{margin-bottom:auto}
.screen>*{flex-shrink:0}
.hidden{display:none!important}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes slideSide{from{transform:translateX(-110%)}to{transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes hintIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(-3deg)}}
@keyframes shine{to{background-position:250% center}}
@keyframes sweep{0%,60%{left:-120%}100%{left:160%}}
@keyframes ringOut{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px rgba(255,140,148,.25),0 8px 22px rgba(170,150,218,.4)}50%{box-shadow:0 0 0 6px rgba(255,140,148,.35),0 10px 28px rgba(170,150,218,.55)}}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.ic.f{fill:currentColor}
.ic.s{color:#f5a623}

.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:6px}

h1{font-size:42px;font-weight:900;color:#fff;text-align:center;letter-spacing:.5px;text-shadow:0 4px 20px rgba(88,62,170,.55),0 2px 0 rgba(88,62,170,.25)}

p{font-weight:600}
.card{width:100%;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:16px;border:1px solid rgba(255,255,255,.85);box-shadow:0 12px 34px rgba(98,78,170,.22)}

.btn.purple{background:linear-gradient(135deg,#b8a6ee,#8f78d6)}
.btn.blue{background:linear-gradient(135deg,#8fd6f0,#4fb0dc)}
.btn.green{background:linear-gradient(135deg,#6fc873,#3f9e45)}

.stack{width:100%;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;width:100%}
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink);font-weight:900;font-size:16px}
.topbar .ttl{flex:1;text-align:center;font-size:19px;color:#fff;text-shadow:0 2px 10px rgba(88,62,170,.5)}
.topbar .chip{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:5px 14px;font-size:14px;color:var(--purple-d);box-shadow:0 4px 12px rgba(98,78,170,.15)}
.mini{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.8);color:var(--purple-d);cursor:pointer;display:grid;place-items:center;box-shadow:0 5px 14px rgba(98,78,170,.2);transition:transform .15s}

.lvTop{display:flex;align-items:center;gap:14px;text-align:right}

.bar{width:100%;height:12px;background:rgba(170,150,218,.22);border-radius:999px;overflow:hidden;margin:10px 0 6px}

.chev{width:20px;height:20px;color:#b3accd;stroke-width:2.6}
.hud{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:9px 14px;box-shadow:0 8px 22px rgba(98,78,170,.18)}

.timerCard{display:flex;align-items:center;gap:18px;padding:12px 18px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .rt{stroke:rgba(170,150,218,.2)}
#tRing{stroke:url(#gT);stroke-linecap:round;transition:stroke-dashoffset .12s linear,stroke .3s}

#ptsLbl small{display:block;font-size:13px;color:var(--mute);font-weight:700}

.dots{display:flex;gap:6px;margin-top:8px}
.dots i{flex:1;max-width:30px;height:7px;border-radius:9px;background:rgba(170,150,218,.25);transition:background .3s}

.status{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:16px;font-weight:800;font-size:15px;text-align:center;animation:pop .3s ease;box-shadow:0 6px 16px rgba(60,40,130,.12)}

.status.info{background:#fff6d6;color:#8a6d00;border:2px solid #ffd54f}

.status.bad{background:#ffe3e3;color:#c62828;border:2px solid #ef9a9a}
.hint{display:flex;align-items:center;gap:11px;background:#f8f6ff;border:2px solid rgba(170,150,218,.28);border-right:5px solid var(--purple);border-radius:16px;padding:10px 12px;font-size:17px;font-weight:700;margin-bottom:8px;line-height:1.5;opacity:.72;box-shadow:0 2px 8px rgba(0,0,0,.05);color:var(--ink)}
.hint:last-child{margin-bottom:0}
.hint.new{opacity:1;background:#fff;border-color:var(--purple);border-right-color:var(--pink);animation:hintIn .45s ease,glow 2s ease-in-out .45s 2}
.hint.tap{cursor:pointer;border-style:dashed}
.hint.caught{text-decoration:line-through;background:#ffe9e9;border-color:#ef9a9a}
.hint .cg{color:#c62828;display:inline-flex}
.hn{background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 3px 8px rgba(170,150,218,.6);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.reveals{width:100%;display:flex;flex-direction:column;gap:6px}
.rev{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border:2px dashed var(--pink);border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;color:#555;animation:pop .3s ease}
.rev .ic{color:var(--pink);width:20px;height:20px}
.cards{width:100%;display:flex;flex-direction:column;gap:7px}
.crow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cardBtn{background:linear-gradient(180deg,#fff,#f1eeff);border:1.5px solid rgba(170,150,218,.55);border-radius:16px;padding:8px 2px 7px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 6px 14px rgba(98,78,170,.18);transition:transform .15s}
.cardBtn .ci{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#bba9ee,#8f78d6);color:#fff;display:grid;place-items:center;box-shadow:0 4px 10px rgba(143,120,214,.4)}
.cardBtn .ci .ic{width:19px;height:19px}
.cardBtn small{font-size:11px;font-weight:800;color:var(--ink);line-height:1.2;text-align:center}
.cardBtn em{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-size:11px;font-weight:900;color:#a8750a;background:rgba(255,215,0,.22);border-radius:8px;padding:0 6px}
.cardBtn em .ic{width:12px;height:12px}
.cardBtn:not(:disabled):hover{transform:translateY(-3px)}
.cardBtn:active{transform:scale(.93)}
.cardBtn:disabled{opacity:.42;filter:grayscale(.9);pointer-events:none}
#side{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;z-index:160;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
@keyframes slideDown{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}
.sideNote{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.97);box-shadow:0 10px 26px rgba(60,40,130,.32);color:var(--ink);font-size:14px;font-weight:800;padding:8px 16px;border-radius:999px;border:1.5px solid rgba(255,215,0,.7);animation:slideDown .35s ease;max-width:92%;transition:opacity .4s,transform .4s}
.sideNote .ic{color:#f5a623;width:18px;height:18px}
.sideNote.out{opacity:0;transform:translateY(-130%)}
.result{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;animation:pop .45s ease;padding:22px 16px}
.resIcon{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;animation:pop .55s ease both}
.resIcon .ic{width:48px;height:48px;stroke-width:2.8}
.resIcon::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--rc,#4caf50);animation:ringOut 1.7s ease-out infinite}
.resIcon.win{--rc:#4caf50;background:linear-gradient(145deg,#7ccf80,#3f9e45);box-shadow:0 14px 30px rgba(63,158,69,.45)}
.resIcon.fail{--rc:#ff7b86;background:linear-gradient(145deg,#ff9aa4,#f2536a);box-shadow:0 14px 30px rgba(242,83,106,.45)}
.resIcon.skip{--rc:#4fb0dc;background:linear-gradient(145deg,#8fd6f0,#4fb0dc);box-shadow:0 14px 30px rgba(79,176,220,.45)}
.resTitle{font-size:27px;font-weight:900;color:var(--ink)}
.resWord{font-size:24px;font-weight:900;color:var(--ink);background:rgba(170,150,218,.14);padding:6px 20px 8px;border-radius:16px;border:1.5px dashed rgba(170,150,218,.5)}
.resWord small{display:block;font-size:12px;color:var(--mute);font-weight:700;line-height:1.2}
.resPts{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:6px;font-weight:900;color:var(--mute);font-size:19px}
.resPts b{direction:ltr;unicode-bidi:isolate}
.resPts.win b{font-size:46px;line-height:1.1;color:#3f9e45;text-shadow:0 4px 14px rgba(76,175,80,.35)}
.resPts.win span{font-size:19px;color:var(--ink)}
.resPts small{width:100%;font-size:13px;color:var(--mute);font-weight:700}
.resNote{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:800;color:var(--mute)}
.resNote .ic{width:18px;height:18px}
.overlay{position:fixed;inset:0;background:rgba(40,25,90,.65);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}
.modal{background:#fff;border-radius:28px;padding:26px 22px;width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .35s ease;box-shadow:0 24px 60px rgba(30,15,80,.4)}
.mTile{width:72px;height:72px;border-radius:24px;background:linear-gradient(145deg,#ff9aa4,#f2536a);display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(242,83,106,.45)}
.mTile .ic{width:36px;height:36px}
.modal p{color:var(--mute);font-size:16px;line-height:1.7}
.modal h2{color:var(--ink)}
.bigScore{font-size:72px;font-weight:900;background:linear-gradient(135deg,var(--purple-d),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05;animation:pop .6s ease}
.stars{display:flex;gap:8px;justify-content:center;direction:ltr}
.stw{display:inline-flex;animation:starPop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
.stars .ic{width:46px;height:46px}
.stars .ic.st.on{color:#ffc61a;filter:drop-shadow(0 5px 10px rgba(245,166,35,.55))}
.stars .ic.st.off{color:#d4cdec;fill:#ebe7f8}
.newBest{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#ffd75e,#f5a623);color:#5d4300;font-weight:900;padding:5px 16px;border-radius:999px;animation:pulse 1.5s infinite;box-shadow:0 6px 16px rgba(245,166,35,.45)}
.newBest .ic{width:18px;height:18px}
.achRow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:18px;margin-bottom:8px;background:#f6f3ff;border:1.5px solid rgba(170,150,218,.4);box-shadow:0 2px 8px rgba(0,0,0,.05);text-align:right}
.achRow:last-child{margin-bottom:0}
.achRow.lock{opacity:.5;filter:grayscale(1)}
.achRow .tile{width:44px;height:44px;border-radius:14px}
.achRow .tile .ic{width:23px;height:23px}
.achRow b{display:block;font-size:16px;color:var(--ink)}
.achRow div>span{font-size:13px;color:var(--mute);font-weight:600}
@media (prefers-reduced-motion:reduce){.bg b,.bg i,.mark,.btn::after{animation:none}}
body.sab-cmirror #app{transform:scaleX(-1)}
body.sab-ctint #app{filter:hue-rotate(170deg) saturate(2.4)}
body.sab-creverse #app :is(.hint span:last-child,.rev,.status,small,h3,#ptsLbl,#roundLbl,#hintLbl,.hud span){unicode-bidi:bidi-override;direction:ltr}

@keyframes sabUpside{0%,100%{transform:rotate(160deg) translate(0,0) scale(.85)}20%{transform:rotate(225deg) translate(-14%,10%) scale(.7)}40%{transform:rotate(140deg) translate(12%,-12%) scale(.9)}60%{transform:rotate(250deg) translate(-10%,-10%) scale(.7)}80%{transform:rotate(120deg) translate(14%,8%) scale(.85)}}
body.sab-spin #app{animation:sabSpin 3.6s linear infinite}

let ctx=null;
function tone(f,d,type,v,delay){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    ctx=ctx||new AC();
    if(ctx.state==='suspended')ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||'sine';o.frequency.value=f;
    o.connect(g);g.connect(ctx.destination);
    const t=ctx.currentTime+(delay||0);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v||.3,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.start(t);o.stop(t+d);
  }catch(e){}
}

function norm(s){
  let t=String(s||'').toLowerCase();
  t=t.replace(/[ً-ٰٟـ]/g,'');
  t=t.replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
  t=t.replace(/[^ء-غف-يa-z0-9]/g,'');
  if(t.startsWith('ال')&&t.length>2)t=t.slice(2);
  return t;
}
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function isCorrect(text,w){
  const n=norm(text);
  if(!n)return false;
  const list=[w.w,...w.alts].map(norm);
  if(list.includes(n))return true;
  return n.length>=5&&list.some(a=>a.length>=5&&Math.abs(a.length-n.length)<=1&&lev(a,n)<=1);
}
function pickHO(i,rnd){
  const n=WORDS[i].hints.length,out=[];
  for(let k=0;k<6;k++){
    const a=Math.floor(k*n/6),b=Math.max(a+1,Math.floor((k+1)*n/6));
    out.push(Math.min(n-1,a+Math.floor(rnd()*(b-a))));
  }
  return out;
}

let currentScreen='sHome',run=null,W=null,autoT=null,pausedAt=0,lastTick=-1;

function levelOf(total){
  let cur=LEVELS[0],next=null;
  for(let i=0;i<LEVELS.length;i++){if(total>=LEVELS[i].min){cur=LEVELS[i];next=LEVELS[i+1]||null}}

function groupCount(g){return WORDS.filter(w=>g.t.includes(w.type)).length}
function renderCats(){

function pickMode(m){
  if(m==='category'){renderCats();return}
  startRun(m,null);
}

function buildQueue(mode,cat,rnd){
  let idx=WORDS.map((_,i)=>i);
  if(mode==='category'){
    const g=GROUPS.find(x=>x.k===cat);
    idx=idx.filter(i=>g.t.includes(WORDS[i].type));
  }
  const seen=new Set(save.seen);
  let fresh=idx.filter(i=>!seen.has(WORDS[i].w));
  const cfg=MODES[mode];
  const need=cfg.words?Math.min(cfg.words,idx.length):Math.min(20,idx.length);
  if(fresh.length<need){
    const names=new Set(idx.map(i=>WORDS[i].w));
    save.seen=save.seen.filter(w=>!names.has(w));
    writeSave();
    fresh=idx;
  }
  return shuffle(fresh,rnd);
}

function startRun(m,cat){
  const cfg=MODES[m];
  const rnd=Math.random;
  const queue=buildQueue(m,cat,rnd);
  if(!queue.length)return;
  clearTimeout(autoT);
  run={m,cat,cfg,rnd,queue,qi:-1,round:0,limit:cfg.words?Math.min(cfg.words,queue.length):0,hearts:cfg.hearts,maxHearts:cfg.hearts,score:0,combo:0,bestCombo:0,coins:5,coinsPeak:5,correct:0,wrong:0,fails:0,lostHeart:false,unlocked:[],over:false,last:null,endsAt:cfg.total?Date.now()+cfg.total:0};
  W=null;
  nextWord();
}

function hMs(){return run.cfg.stageMs?run.cfg.stageMs[Math.min(4,Math.floor((run.round-1)/3))]:run.cfg.hintMs}
function nextWord(){
  clearTimeout(autoT);
  if(!run||run.over)return;
  if(run.limit&&run.round>=run.limit){endRun('done');return}
  run.qi++;
  if(run.qi>=run.queue.length){
    run.queue=buildQueue(run.m,run.cat,run.rnd);
    run.qi=0;
    if(!run.queue.length){endRun('done');return}
  }
  const idx=run.queue[run.qi];
  const word=WORDS[idx];
  run.round++;
  if(!save.seen.includes(word.w)){save.seen.push(word.w);writeSave()}
  const ho=pickHO(idx,run.rnd);
  const hints=ho.map(k=>word.hints[k]);
  let fakeAt=null,sab=null;
  if(run.round>=2){
    const r=run.rnd();
    if(r<.2)sab=SAB_KINDS[Math.floor(run.rnd()*SAB_KINDS.length)];
    else if(r<.42){
      const pool=WORDS.map((_,i)=>i).filter(i=>i!==idx&&WORDS[i].type===word.type);
      if(pool.length){
        const at=1+Math.floor(run.rnd()*4);
        const oi=pool[Math.floor(run.rnd()*pool.length)];
        const t=WORDS[oi].hints[pickHO(oi,run.rnd)[at]];
        if(t&&!word.hints.includes(t)){hints[at]=t;fakeAt=at}
      }
    }
  }
  W={idx,word,ho,hints,fakeAt,fakeTries:0,fakeResolved:false,fakeCaught:false,hintIndex:0,hintSpan:hMs(),hintEndsAt:Date.now()+hMs(),used:{},risk:false,sab,reveals:[],done:false,fresh:true};
  if(run.m==='stages'&&run.round>1&&run.round%3===1)sideNote('المرحلة '+((run.round-1)/3+1)+': التلميحات أسرع','flag');
  lastTick=-1;
  applySab();
  show('sPlay');
  $('ansInput').value='';
  renderPlay();
}

function mult(){return 1+Math.min(run.combo,10)*0.1}
function potential(){return Math.round((6-W.hintIndex)*mult()*(W.risk?2:1)*(W.sab?2:1))}

function renderHints(){
  let h='';
  const tappable=W.fakeAt!==null&&!W.fakeResolved;
  for(let i=W.hintIndex;i>=0;i--){
    const caught=W.fakeCaught&&W.fakeAt===i;
    const cls='hint'+(i===W.hintIndex&&W.fresh?' new':'')+(tappable?' tap':'')+(caught?' caught':'');
    h+=`<div class="${cls}" data-i="${i}"><span class="hn">${i+1}</span><span>${esc(W.hints[i])}</span>${caught?'<span class="cg">'+ic('search')+'</span>':''}</div>`;

  else fm.classList.add('hidden');
}

function extraHints(){return W.word.hints.filter((_,i)=>!W.ho.includes(i))}
function cardOff(c){
  if(!W||W.done)return true;
  if(run.coins<c.c)return true;
  if(c.k!=='skip'&&W.used[c.k])return true;
  if(INFO.includes(c.k)&&W.hintIndex===0)return true;
  if(c.k==='hint'&&!extraHints().length)return true;
  return false;
}

function renderCards(){
  const btn=c=>`<button class="cardBtn" data-k="${c.k}"${cardOff(c)?' disabled':''}><span class="ci">${ic(c.i)}</span><small>${c.l}</small><em>${ic('coin','f')}${c.c}</em></button>`;
  $('cardsBar').innerHTML=`<div class="crow">${CARDS.slice(0,4).map(btn).join('')}</div><div class="crow">${CARDS.slice(4).map(btn).join('')}</div>`;

}

}

  $('ptsLbl').innerHTML='<small>لو جاوبت دلوقتي</small><strong>'+p+'</strong><span class="u">'+(p===1?'نقطة':p===2?'نقطتين':p<=10?'نقاط':'نقطة')+'</span>';

function renderPlay(){
  $('roundLbl').textContent=run.m==='stages'?`مرحلة ${Math.floor((run.round-1)/3)+1} | كلمة ${run.round} من ${run.limit}`:run.limit?`كلمة ${run.round} من ${run.limit}`:`كلمة ${run.round}`;
  $('hintLbl').textContent=`تلميح ${W.hintIndex+1} من 6`;
  renderHUD();renderPtsLbl();renderHints();renderReveals();renderCards();renderDots();
  const sm=$('sabMsg');
  if(W.sab){sm.innerHTML=ic('bolt','f')+'<span>تخريب! الشاشة هتتخربط بس نقط الكلمة دي ×٢ لو جاوبت صح</span>';sm.classList.remove('hidden')}
  else sm.classList.add('hidden');
  setMsg('');
  $('ansPanel').classList.remove('hidden');
  updateTimerUI(Date.now());
}

function updateTimerUI(t){
  if(!W)return;
  const rem=Math.max(0,W.hintEndsAt-t);
  const sec=Math.ceil(rem/1000);
  const cls=sec<=3?'danger':sec<=6?'warn':'';
  $('tNum').textContent=sec;
  $('tNum').className=cls;
  $('tRing').style.strokeDashoffset=(RC*(1-Math.min(1,rem/W.hintSpan))).toFixed(1);
  $('tRing').setAttribute('class',cls);
  if(run.endsAt)$('hTotal').innerHTML=ic('clock')+'<b>'+Math.max(0,Math.ceil((run.endsAt-t)/1000))+'</b>';
  if(sec<=3&&sec>0&&sec!==lastTick){lastTick=sec;SFX.tick()}
  if(sec>3)lastTick=-1;
}

function tick(){
  if(!run||run.over)return;
  const t=Date.now();
  if(run.endsAt&&t>=run.endsAt){endRun('time');return}
  if(currentScreen!=='sPlay'||!W||W.done)return;
  if(t>=W.hintEndsAt){advanceHint();return}
  updateTimerUI(t);
}

function advanceHint(){
  if(W.hintIndex>=5){failWord();return}
  W.hintIndex++;
  W.hintSpan=hMs();
  W.hintEndsAt=Date.now()+hMs();
  W.fresh=true;
  lastTick=-1;
  $('hintLbl').textContent=`تلميح ${W.hintIndex+1} من 6`;
  renderHints();renderPtsLbl();renderCards();renderDots();setMsg('');
}

function submit(){
  if(!run||!W||W.done||currentScreen!=='sPlay')return;
  const text=$('ansInput').value.trim();
  if(!text)return;
  $('ansInput').value='';
  if(isCorrect(text,W.word))winWord();else wrongAnswer();
}

function wrongAnswer(){
  run.wrong++;
  run.combo=0;
  let msg='إجابة غلط';
  if(W.risk){run.score=Math.max(0,run.score-3);W.risk=false;msg+=' وخسرت ٣ نقط من الريسك'}
  if(run.cfg.hearts){run.hearts--;run.lostHeart=true;msg+=' وخسرت قلب'}
  if(run.cfg.total){run.endsAt-=3000;msg+=' (-٣ ثواني)'}
  SFX.wrong();vibrate(120);flash('bad');hitHud();
  const inp=$('ansInput');
  inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad');
  if(run.cfg.hearts&&run.hearts<=0){W.done=true;endRun('hearts');return}
  setMsg(msg,'bad');
  renderHUD();renderPtsLbl();
}

function winWord(){
  W.done=true;
  const base=6-W.hintIndex;
  const m=mult();
  const rk=W.risk?2:1,sb=W.sab?2:1;
  const pts=Math.round(base*m*rk*sb);
  run.score+=pts;
  run.combo++;
  run.bestCombo=Math.max(run.bestCombo,run.combo);
  run.correct++;
  const gain=Math.max(1,4-W.hintIndex);
  run.coins+=gain;
  run.coinsPeak=Math.max(run.coinsPeak,run.coins);
  let bonus='';
  if(run.cfg.hearts&&run.combo%5===0&&run.hearts<run.maxHearts){run.hearts++;bonus='كومبو '+run.combo+': رجعلك قلب'}
  if(W.hintIndex===0)unlock('sharp');
  if(run.combo>=5)unlock('streak5');
  if(run.combo>=10)unlock('streak10');
  if(W.risk)unlock('risky');
  if(W.sab)unlock('sabHero');
  if(run.coinsPeak>=30)unlock('rich');
  if(run.m==='timed'&&run.correct>=15)unlock('speedy');
  if(run.m==='endless'&&run.correct>=20)unlock('survivor');
  run.last={type:'win',pts,base,m,rk,sb,gain,bonus,hint:W.hintIndex+1};
  SFX.correct();vibrate(40);flash('good');
  if(run.m==='stages'&&run.round%3===0&&run.round<run.limit){run.coins+=2;run.coinsPeak=Math.max(run.coinsPeak,run.coins);sideNote('خلصت المرحلة '+run.round/3+' وخدت ٢ عملة','flag');boom(90)}
  showResult();
  boom(run.combo>=5?110:60);
}

function failWord(){
  W.done=true;
  run.combo=0;
  run.fails++;
  let note='';
  if(W.risk){run.score=Math.max(0,run.score-3);note='الريسك خصم منك ٣ نقط'}
  if(run.cfg.hearts){run.hearts--;run.lostHeart=true}
  run.last={type:'fail',note};
  SFX.wrong();
  if(run.cfg.hearts&&run.hearts<=0){endRun('hearts');return}
  showResult();
}

function skipWord(){
  W.done=true;
  run.last={type:'skip'};
  showResult();
}

function showResult(){
  clearSab();
  const l=run.last,ri=$('resIcon'),rp=$('resPts');
  $('resWord').innerHTML='<small>الكلمة</small>'+esc(W.word.w);

    ri.className='resIcon win';ri.innerHTML=ic('check');
    $('resTitle').textContent='جاوبت صح!';

    rp.className='resPts win';
    rp.innerHTML='<b></b><span>نقطة</span>'+(expr!==String(l.base)?'<small>('+esc(expr)+')</small>':'');
    countUp(rp.firstChild,l.pts,'+');
    $('resNote').innerHTML=ic('coin','f')+'<span>+'+l.gain+' عملة'+(l.bonus?' | '+esc(l.bonus):'')+'</span>';
  }else if(l.type==='fail'){
    ri.className='resIcon fail';ri.innerHTML=ic('clock');
    $('resTitle').textContent='معرفتهاش!';
    rp.className='resPts fail';

  }else{
    ri.className='resIcon skip';ri.innerHTML=ic('skip');

  }

  $('resHud').innerHTML=hh+'<span class="pill">'+ic('star','f')+'<b>'+run.score+'</b></span><span class="pill cb">'+ic('flame','f')+'<b>'+run.combo+'</b></span><span class="pill">'+ic('coin','f')+'<b>'+run.coins+'</b></span>';
  show('sRes');
  if(run.cfg.total){clearTimeout(autoT);autoT=setTimeout(nextWord,900)}
}

function endRun(reason){
  if(!run||run.over)return;
  run.over=true;
  clearTimeout(autoT);
  clearSab();
  const before=levelOf(save.total).cur;
  save.total+=run.score;
  save.played++;
  save.correct+=run.correct;
  save.bestCombo=Math.max(save.bestCombo,run.bestCombo);
  let newBest=false,counted=true;
  if(run.m==='stages'&&run.round>=10)unlock('stages');
  if(counted&&run.score>(save.best[run.m]||0)){save.best[run.m]=run.score;newBest=run.score>0}
  if(reason==='done'&&run.m==='classic'&&!run.lostHeart&&run.limit&&run.correct>=run.limit*0.8)unlock('flawless');
  writeSave();
  const after=levelOf(save.total).cur;
  const ei=$('endIcon');ei.className='resIcon '+(reason==='done'?'win':reason==='hearts'?'fail':'skip');ei.innerHTML=ic(reason==='done'?'trophy':reason==='hearts'?'heart':'clock');
  $('endTitle').textContent=reason==='done'?'خلصت الجولة!':reason==='hearts'?'القلوب خلصت':'الوقت خلص';
  countUp($('endScore'),run.score,'','',900);
  $('endBest').classList.toggle('hidden',!newBest);
  let note='';
  if(reason==='hearts'&&W)note='الكلمة كانت: '+W.word.w;
  if(run.m==='stages')note='وصلت للمرحلة '+(Math.min(5,Math.floor((run.round-1)/3)+1))+' من ٥'+(note?' | '+note:'');
  $('endNote').textContent=note;
  const tot=run.correct+run.wrong+run.fails;
  const acc=tot?Math.round(run.correct/tot*100):0;
  $('endStats').innerHTML=sbox('check',run.correct,'إجابة صح')+sbox('flame',run.bestCombo,'أطول سلسلة')+sbox('target',acc+'%','الدقة');
  const stc=run.correct===0?0:acc>=85?3:acc>=60?2:1;
  $('endStars').innerHTML=[0,1,2].map(i=>'<span class="stw" style="--d:'+(0.35+i*0.22)+'s">'+ic('star',(i<stc?'f on':'off')+' st')+'</span>').join('');
  const el=$('endLevel');
  if(after.n!==before.n){el.innerHTML='<div class="lvTop">'+lvBadge(LEVELS.indexOf(after))+'<div class="lvTxt"><div class="lvPts">مستوى جديد</div><div class="lvName">ترقيت لـ '+after.n+'!</div></div></div>';el.classList.remove('hidden')}
  else el.classList.add('hidden');
  const al=$('endAch');
  if(run.unlocked.length){
    $('endAchList').innerHTML=run.unlocked.map(a=>`<div class="achRow"><span class="tile ach">${ic(a.i)}</span><div><b>${a.t}</b><span>${a.d}</span></div></div>`).join('');
    al.classList.remove('hidden');
  }else al.classList.add('hidden');
  $('btnShare').classList.toggle('hidden',run.m!=='stages');
  show('sEnd');
  if(reason==='done'||newBest){SFX.win();boom(170)}else SFX.wrong();
}

function useCard(k){
  if(!run||!W||W.done)return;
  const c=CARDS.find(x=>x.k===k);
  if(!c||cardOff(c))return;
  run.coins-=c.c;
  SFX.click();
  const w=W.word;
  const rev=t=>{W.reveals.push({icon:c.i,text:t})};
  if(k==='skip'){skipWord();return}
  W.used[k]=true;
  if(k==='len'){
    const n=w.w.replace(/\s/g,'').length;
    const words=w.w.trim().split(/\s+/).length;
    rev(`عدد الحروف: ${n}${words>1?` (${words} كلمات)`:''}`);
  }else if(k==='last'){
    const t=w.w.replace(/\s/g,'');
    rev(`بتنتهي بحرف "${t.charAt(t.length-1)}"`);
  }else if(k==='first'){
    const hasAl=w.w.startsWith('ال');
    const base=hasAl?w.w.slice(2):w.w;
    rev(hasAl?`بتبدأ بـ "ال" وبعدها حرف "${base.charAt(0)}"`:`بتبدأ بحرف "${base.charAt(0)}"`);
  }else if(k==='pos'){
    const hasAl=w.w.startsWith('ال');
    const ch=Array.from((hasAl?w.w.slice(2):w.w).replace(/\s/g,''));
    const lo=ch.length>2?1:0;
    const idx=lo+Math.floor(run.rnd()*(ch.length-lo));
    rev(`الحرف رقم ${idx+1}${hasAl?' (من غير ال)':''} في الكلمة هو "${ch[idx]}"`);
  }else if(k==='hint'){
    const ex=extraHints();
    rev('تلميح إضافي: '+ex[Math.floor(run.rnd()*ex.length)]);
  }else if(k==='risk'){
    W.risk=true;
    rev('ريسك شغال: نقطك ×٢ لو صح، وبيتخصم منك ٣ لو غلط');
  }else if(k==='freeze'){
    W.hintEndsAt+=10000;
    W.hintSpan+=10000;
    rev('الوقت اتجمد: +١٠ ثواني على التلميح ده');
  }
  renderHUD();renderPtsLbl();renderReveals();renderCards();
}

function flagHint(i){
  if(!run||!W||W.done||W.fakeAt===null||W.fakeResolved)return;
  if(i===W.fakeAt){
    W.fakeResolved=true;W.fakeCaught=true;
    run.coins+=3;
    run.coinsPeak=Math.max(run.coinsPeak,run.coins);
    unlock('liar');
    SFX.correct();
    setMsg('كشفته! +٣ عملات','go');
  }else{
    W.fakeTries++;
    SFX.wrong();
    if(W.fakeTries>=2){W.fakeResolved=true;setMsg('ضاعت المحاولات','bad')}
    else setMsg('التلميح ده مش الكدب','bad');
  }
  renderHints();renderHUD();renderCards();
}

function confirmExit(){
  if($('exitOv'))return;
  const o=document.createElement('div');
  o.id='exitOv';o.className='overlay';
  o.innerHTML='<div class="modal"><div class="mTile">'+ic('exit')+'</div><h2>متأكد عايز تخرج؟</h2><p>الجولة دي مش هتتحفظ</p><div class="row"><button class="btn red" id="exitYes">نعم</button><button class="btn blue" id="exitNo">لا</button></div></div>';
  document.body.appendChild(o);
  if(run&&W&&!W.done)W.pausedForModal=Date.now();
  $('exitNo').onclick=()=>{
    if(run&&W&&W.pausedForModal){const d=Date.now()-W.pausedForModal;W.hintEndsAt+=d;if(run.endsAt)run.endsAt+=d;W.pausedForModal=0}
    o.remove();
  };
  $('exitYes').onclick=()=>{
    o.remove();
    clearTimeout(autoT);clearSab();
    run=null;W=null;
    renderHome();
  };
}

function renderAch(){
  $('achList').innerHTML=ACH.map(a=>`<div class="achRow${save.ach[a.id]?'':' lock'}"><span class="tile ach">${ic(a.i)}</span><div><b>${a.t}</b><span>${a.d}</span></div></div>`).join('');
  show('sAch');
}

function shareDaily(){
  if(!run)return;
  const txt=`خمّن الكلمة - تحدي المراحل\n⭐ ${run.score} نقطة\n✅ ${run.correct} صح  🔥 أطول سلسلة ${run.bestCombo}`;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>sideNote('اتنسخت النتيجة','check')).catch(()=>prompt('انسخ نتيجتك',txt))}
    else prompt('انسخ نتيجتك',txt);
  }catch(e){prompt('انسخ نتيجتك',txt)}
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){pausedAt=Date.now();return}
  if(pausedAt&&run&&!run.over){
    const d=Date.now()-pausedAt;
    if(W&&!W.done&&currentScreen==='sPlay')W.hintEndsAt+=d;
    if(run.endsAt)run.endsAt+=d;
  }
  pausedAt=0;
});

$('btnPlay').onclick=()=>{SFX.click();renderModes()};
$('btnAch').onclick=()=>{SFX.click();renderAch()};
$('btnMenu').onclick=()=>{location.href='index.html'};
$('modesBack').onclick=renderHome;
$('catsBack').onclick=renderModes;
$('achBack').onclick=renderHome;
$('playExit').onclick=confirmExit;
$('ansBtn').onclick=submit;
$('ansInput').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('hintsBox').addEventListener('click',e=>{
  const h=e.target.closest('.hint');
  if(h)flagHint(parseInt(h.dataset.i,10));
});
$('nextBtn').onclick=()=>{SFX.click();nextWord()};
$('btnAgain').onclick=()=>{SFX.click();if(run)startRun(run.m,run.cat);else renderModes()};
$('btnShare').onclick=shareDaily;
$('btnModes').onclick=()=>{run=null;W=null;renderModes()};
$('endHome').onclick=()=>{run=null;W=null;renderHome()};

document.querySelectorAll('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin',ic(e.dataset.ic)));
renderHome();
setInterval(tick,100);

})();
</script>
</body>
</html>
